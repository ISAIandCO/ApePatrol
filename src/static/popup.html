<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiemMonkey</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="img/icon48.png" alt=""><div><h1>SiemMonkey</h1><p id="status">Connecting…</p></div></header>
  <nav id="tabs" aria-label="Tools">
    <button data-panel="event" class="active">Event</button><button data-panel="process">Process</button>
    <button data-panel="related">Related</button><button data-panel="incidents">Incidents</button>
    <button data-panel="enrichment">Enrichment</button><button data-panel="tools">Tools</button><button data-panel="ai">AI</button>
  </nav>
  <main>
    <section id="event" class="panel active"><h2>Current event</h2><pre id="event-json"></pre><div class="actions"><button id="copy-json">Copy JSON</button><button id="download-json">Download JSON</button><button id="copy-link">Copy link</button><button id="open-rule" disabled>Open rule in Knowledge Base</button></div></section>
    <section id="process" class="panel"><h2>Process context</h2><div class="toolbar"><button id="load-process">Build graph</button><button id="process-tree-mode">Tree</button><button id="process-timeline-mode">Timeline</button><button id="process-zoom-out" title="Zoom out">−</button><button id="process-zoom-in" title="Zoom in">+</button><input id="process-search" type="search" placeholder="Search process"></div><div id="process-output" class="scroll"></div></section>
    <section id="related" class="panel"><h2>Related events</h2><label>Time range <select id="related-range"><option value="5m">±5 min</option><option value="15m" selected>±15 min</option><option value="1h">±1 h</option><option value="24h">±24 h</option></select></label><div id="related-output"></div></section>
    <section id="incidents" class="panel"><h2>Incident context</h2><div id="incident-output"></div></section>
    <section id="enrichment" class="panel"><h2>Local asset / EDR</h2><button id="asset-lookup">Load asset context</button><pre id="asset-output"></pre><h2>External enrichment</h2><button id="vt-lookup">Check current hash in VirusTotal</button><pre id="enrichment-output"></pre></section>
    <section id="tools" class="panel"><h2>Custom filters</h2><select id="custom-filter"></select><pre id="filter-preview"></pre><button id="open-filter">Open filter</button><h2>Table Lists</h2><button id="load-lists">Load available lists</button><select id="table-list"></select><textarea id="table-row" rows="3" placeholder='Row as JSON array, e.g. ["value", "type", "description"]'></textarea><div class="actions"><button id="table-add">Add row</button><button id="table-remove" class="danger">Remove row</button></div><pre id="tools-output"></pre></section>
    <section id="ai" class="panel"><h2>SEC AI Assistant</h2><p id="ai-disclosure"></p><button id="ai-run">Review and send event</button><pre id="ai-output"></pre></section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
