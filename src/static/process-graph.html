<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ApePatrol · Граф процессов</title>
  <link rel="stylesheet" href="process-graph.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/icons/icon-48.png" alt=""><div><h1>Граф процессов</h1><p id="status">Подготовка…</p></div></div>
    <div class="toolbar" aria-label="Управление графом">
      <button id="layout-force" aria-pressed="true">Свободный граф</button>
      <button id="layout-timeline" aria-pressed="false">По времени</button>
      <input id="process-search" type="search" placeholder="Найти процесс, PID, GUID…" aria-label="Поиск по процессам">
      <button id="fit-graph">Вписать</button>
      <button id="reload-graph">Обновить данные</button>
    </div>
  </header>
  <main>
    <canvas id="process-canvas" aria-label="Интерактивный граф связей процессов"></canvas>
    <div id="loading" class="message">Получаю события и строю связи…</div>
    <div id="empty" class="message" hidden>Нет данных для построения графа.</div>
    <aside id="legend" aria-label="Легенда">
      <span><i class="source"></i> Исходный процесс</span>
      <span><i class="process"></i> Остальные процессы</span>
      <span>Размер узла = количество связей</span>
      <span>Колесо — масштаб · перетаскивание — навигация · клик — открыть событие</span>
    </aside>
    <div id="process-tooltip" role="tooltip" hidden></div>
  </main>
  <script src="process-graph.js"></script>
</body>
</html>
