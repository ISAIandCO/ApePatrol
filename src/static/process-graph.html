<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ApePatrol · Граф процессов</title>
  <link rel="stylesheet" href="process-graph.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/icons/icon-48.png" alt=""><div><h1>Граф процессов</h1><p id="status">Подготовка…</p></div></div>
    <div class="toolbar" aria-label="Управление графом">
      <button id="layout-force" aria-pressed="true">Свободный граф</button>
      <button id="layout-timeline" aria-pressed="false">По времени</button>
      <input id="process-search" type="search" placeholder="Найти процесс, PID, GUID…" aria-label="Поиск по процессам">
      <button id="fit-graph">Вписать</button>
      <button id="reload-graph">Обновить данные</button>
      <button id="reconnect-graph" hidden>Подключить SIEM-вкладку</button>
      <button id="open-workspace">Расследования</button>
    </div>
  </header>
  <section class="expansion" aria-label="Подгрузка контекста процессов">
    <div class="expansion-actions">
      <button data-expand="parents">Expand parents</button>
      <button data-expand="children">Expand children</button>
      <button data-expand="both">Expand both</button>
      <button data-expand="siblings">Expand siblings</button>
      <button data-expand="previous">← Предыдущий интервал</button>
      <button data-expand="next">Следующий интервал →</button>
      <label>Шаг <select id="expand-step"><option value="900">15 минут</option><option value="3600" selected>1 час</option><option value="21600">6 часов</option><option value="86400">24 часа</option></select></label>
      <button id="cancel-expand" disabled>Отменить загрузку</button>
      <button id="continue-limit" hidden>Разрешить ещё узлы</button>
    </div>
    <div class="range-controls"><strong id="graph-range">Диапазон не загружен</strong><span id="partial-indicator">Частичный граф</span><label>Начало видимого диапазона <input id="time-slider-start" type="range" min="0" max="100" value="0"></label><label>Конец видимого диапазона <input id="time-slider-end" type="range" min="0" max="100" value="100"></label><span id="time-slider-label"></span></div>
  </section>
  <details class="filters"><summary>Локальные фильтры графа</summary><div class="filter-grid"><label>Процесс<input id="filter-process-name" type="search"></label><label>Путь<input id="filter-process-path" type="search"></label><label>Учётная запись<input id="filter-account" type="search"></label><label>PID<input id="filter-pid" type="search"></label><label>Хост<input id="filter-host" type="search"></label><label>Источник / тип события<input id="filter-event-type" type="search"></label><label>С<input id="filter-time-from" type="datetime-local"></label><label>По<input id="filter-time-to" type="datetime-local"></label><label>Связи<select id="filter-relations"><option value="all">Все</option><option value="ancestors">Только предки выбранного</option><option value="descendants">Только потомки выбранного</option><option value="direct">Только прямые связи</option></select></label><label class="checkbox"><input id="filter-hide-isolated" type="checkbox"> Скрыть изолированные узлы</label><button id="filter-reset" type="button">Сбросить фильтры</button></div><p id="filter-count"></p></details>
  <main>
    <canvas id="process-canvas" aria-label="Интерактивный граф связей процессов"></canvas>
    <div id="loading" class="message">Получаю события и строю связи…</div>
    <div id="empty" class="message" hidden>Нет данных для построения графа.</div>
    <aside id="legend" aria-label="Легенда">
      <span><i class="source"></i> Исходный процесс</span>
      <span><i class="process"></i> Остальные процессы</span>
      <span>Размер узла = количество связей</span>
      <span>Колесо — масштаб · перетаскивание — навигация · клик — открыть событие</span>
    </aside>
    <div id="process-tooltip" role="tooltip" hidden></div>
  </main>
  <script src="process-graph.js"></script>
</body>
</html>
